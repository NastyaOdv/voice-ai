<mat-toolbar color="primary" class="app-toolbar">
  @if (user()) {
    <button mat-icon-button (click)="drawer.toggle()" aria-label="Open notes">
      <mat-icon>menu</mat-icon>
    </button>
  }
  <mat-icon class="brand-icon">record_voice_over</mat-icon>
  <span class="brand">English Tutor</span>
  <span class="spacer"></span>
  @if (user(); as u) {
    <span class="user-email">{{ u.email }}</span>
    <button mat-button (click)="logout()">
      <mat-icon>logout</mat-icon>
      Log out
    </button>
  }
</mat-toolbar>

<mat-sidenav-container class="app-shell">
  <mat-sidenav #drawer mode="over" position="start" class="app-drawer">
    <mat-nav-list>
      <a mat-list-item routerLink="/sessions" routerLinkActive="active-link"
         (click)="drawer.close()">
        <mat-icon matListItemIcon>forum</mat-icon>
        <span matListItemTitle>Sessions</span>
      </a>
      <a mat-list-item routerLink="/notes" routerLinkActive="active-link"
         (click)="drawer.close()">
        <mat-icon matListItemIcon>menu_book</mat-icon>
        <span matListItemTitle>Notes</span>
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <main class="app-content">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
