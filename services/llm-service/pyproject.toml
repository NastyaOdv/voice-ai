[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project]
name = "llm-service"
version = "0.1.0"
description = "LLM worker (Anthropic Claude) — consumes the llm.rpc queue, returns structured tutor replies"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.49",
    "aio-pika>=9.4",
    "orjson>=3.10",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
    "mypy>=1.10",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: tests that need a real broker or the Anthropic API",
]
