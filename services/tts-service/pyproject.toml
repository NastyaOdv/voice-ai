[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project]
name = "tts-service"
version = "0.1.0"
description = "Text-to-speech worker (Piper) — consumes the tts.rpc queue"
requires-python = ">=3.11"
dependencies = [
    "piper-tts==1.2.0",
    "onnxruntime>=1.17",
    "aio-pika>=9.4",
    "orjson>=3.10",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
    "mypy>=1.10",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = ["piper.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: tests that need a real broker or model",
]
