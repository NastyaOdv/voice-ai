services:
  stt-worker:
    build: .
    environment:
      RABBITMQ_URL: amqp://guest:guest@orchestrator-rabbitmq:5672/
      STT_QUEUE: stt.rpc
      MODEL_SIZE: base
      DEVICE: cpu
      COMPUTE_TYPE: int8
    volumes:
      # Persist the downloaded model across restarts.
      - stt_model_cache:/root/.cache/huggingface
    networks:
      - webeng

networks:
  # Shared across all services. Create it once: `docker network create webeng`
  webeng:
    external: true

volumes:
  stt_model_cache:
